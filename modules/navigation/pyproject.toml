[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kv260-navigation"
version = "0.2.0"
description = "Independent airway navigation with an eight-lane PL EDT for KV260"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.13,<2", "scikit-image>=0.24,<0.27", "SimpleITK>=2.4,<3"]

[project.optional-dependencies]
notebook = ["ipywidgets>=8,<9", "ipykernel>=6,<8"]
test = ["pytest>=8,<10"]

[project.scripts]
kv260-navigation = "navigation.cli:main"

[tool.setuptools.packages.find]
include = ["navigation", "pl"]
namespaces = false

[tool.setuptools.package-data]
navigation = ["*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
